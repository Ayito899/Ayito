<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="logo">
        <div class="logo-icon">🎓</div>
        <span class="logo-text">Student Portal</span>
      </div>

      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your student account</p>

      <div id="alert-box"></div>

      <form action="login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text"
                 placeholder="e.g. jsmith" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:.4rem;">
          Sign In →
        </button>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="register.html">Create one</a>
        &nbsp;·&nbsp; <a href="index.html">← Home</a>
      </div>

    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
